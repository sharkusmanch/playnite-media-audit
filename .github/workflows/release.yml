---
name: "Release"

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate version consistency
        run: |
          ext_version=$(yq '.Version' extension.yaml)
          manifest_version=$(yq '.Packages[0].Version' manifest.yaml)
          addon_id=$(yq '.AddonId' manifest.yaml)
          repo_url="https://github.com/${{ github.repository }}"

          echo "extension.yaml version: $ext_version"
          echo "manifest.yaml version:  $manifest_version"

          errors=0

          if [ "$ext_version" != "$manifest_version" ]; then
            echo "::error::Version mismatch: extension.yaml ($ext_version) != manifest.yaml ($manifest_version)"
            errors=$((errors + 1))
          fi

          expected_url="${repo_url}/releases/download/v${ext_version}/${addon_id%%_*}_v${ext_version}.pext"
          actual_url=$(yq '.Packages[0].PackageUrl' manifest.yaml)

          echo "Expected PackageUrl: $expected_url"
          echo "Actual PackageUrl:   $actual_url"

          if [ "$expected_url" != "$actual_url" ]; then
            echo "::error::PackageUrl mismatch in manifest.yaml. Expected: $expected_url"
            errors=$((errors + 1))
          fi

          # The release job renders these with `"- " + .`, which dies on anything that
          # isn't a plain string. An unquoted entry containing ": " parses as a YAML map,
          # so fail here instead of after the build has already run.
          if [ -n "$(yq '.Packages[0].Changelog[] | select(tag != "!!str")' manifest.yaml)" ]; then
            echo "::error::manifest.yaml changelog entries must all be strings. An entry containing ': ' parses as a YAML map - wrap it in quotes."
            errors=$((errors + 1))
          fi

          if [ $errors -gt 0 ]; then
            exit 1
          fi

          echo "All validations passed."

  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: robinraju/release-downloader@v1.13
        id: download_playnite
        with:
          repository: "JosefNemec/Playnite"
          latest: true
          tarBall: false
          zipBall: false
          fileName: "*.7z"
          out-file-path: ${{ runner.temp }}/playnite

      - name: Extract Playnite
        run: 7z x ${{ runner.temp }}/playnite/*.7z -o${{ runner.temp }}/playnite

      # Tests gate the release too, so a workflow_dispatch can't ship a build that
      # never had them run against it.
      - name: Test
        run: |
          dotnet test Tests/MediaAudit.Tests.csproj -c Release

      - run: |
          dotnet build MediaAudit.csproj -c Release
          ${{ runner.temp }}/playnite/Toolbox.exe pack bin/Release/net462/ dist

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            dist/*.pext

  release:
    name: "Release"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # yq is preinstalled on the runner (the release-notes step below already relies
      # on it), so use it directly rather than pulling an action from a floating ref.
      - name: Get Version
        id: version
        run: echo "result=$(yq '.Version' extension.yaml)" >> "$GITHUB_OUTPUT"

      - name: Pull artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts

      - name: Build release notes from manifest
        run: |
          yq -r '.Packages[0].Changelog[] | "- " + .' manifest.yaml > notes.md

      - run: |
          mv MediaAudit_*.pext MediaAudit_v${{ steps.version.outputs.result }}.pext

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.result }}" \
            --title "v${{ steps.version.outputs.result }}" \
            --notes-file notes.md \
            MediaAudit_v${{ steps.version.outputs.result }}.pext
